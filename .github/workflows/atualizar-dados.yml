# Toda segunda-feira de manhã (horário de Brasília) coleta os dados abertos da Câmara e do
# Senado, gera os arquivos do site e grava no repositório. A Cloudflare publica o site
# sozinha a cada push na main (integração com o GitHub em Workers & Pages).
#
# Para rodar na hora: aba Actions > "Atualizar dados" > Run workflow.

name: Atualizar dados

on:
  schedule:
    - cron: '17 9 * * 1'      # segunda-feira, 09:17 UTC = 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar dados das APIs da Câmara e do Senado
        run: python scripts/coletar.py

      - name: Gerar os arquivos do site
        run: python scripts/build.py .

      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw site/data
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última coleta."
            exit 0
          fi
          git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
